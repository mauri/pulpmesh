name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # spinel is built from source: it compiles pulpmesh ahead of time, and the
  # binary it emits matches the machine it runs on. Pin SPINEL_REF to a tag or
  # sha to freeze the compiler.
  SPINEL_REPO: matz/spinel
  SPINEL_REF: master
  TARGET: linux-x86_64

jobs:
  checks:
    # CRuby-only guards: neither needs spinel, so they fail fast and in parallel
    # with the build below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.9"
      - run: gem install --no-document erubi kramdown
      - name: Committed codegen is up to date
        run: rake check
      - name: CRuby matches the spinel snapshots
        run: rake parity

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: pulpmesh

      - name: Check out spinel
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SPINEL_REPO }}
          ref: ${{ env.SPINEL_REF }}
          path: spinel

      - id: spinel-rev
        run: echo "sha=$(git -C spinel rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Restore/save rather than the combined action: a half-built spinel from a
      # failed job must not be cached under a key later runs would trust.
      - name: Restore spinel build
        id: spinel-cache
        uses: actions/cache/restore@v4
        with:
          path: spinel
          key: spinel-${{ env.TARGET }}-${{ steps.spinel-rev.outputs.sha }}

      - name: Build spinel
        if: steps.spinel-cache.outputs.cache-hit != 'true'
        run: |
          make -C spinel deps
          make -C spinel -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Save spinel build
        if: steps.spinel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: spinel
          key: spinel-${{ env.TARGET }}-${{ steps.spinel-rev.outputs.sha }}

      - run: echo "$GITHUB_WORKSPACE/spinel/bin" >> "$GITHUB_PATH"

      - name: Build pulpmesh
        working-directory: pulpmesh
        run: spin build

      - name: Test
        working-directory: pulpmesh
        run: spin test

      - name: Smoke-test the binary
        working-directory: pulpmesh
        run: ./build/bin/pulpmesh --version

      # Upload as a tarball: the zip GitHub wraps artifacts in does not carry
      # the executable bit, and these are shipped straight to users.
      - name: Package
        working-directory: pulpmesh
        run: tar -czf "pulpmesh-$TARGET.tar.gz" -C build/bin pulpmesh

      - uses: actions/upload-artifact@v4
        with:
          name: pulpmesh-${{ env.TARGET }}
          path: pulpmesh/pulpmesh-${{ env.TARGET }}.tar.gz
          if-no-files-found: error

  package:
    # Ships the same binary as an image under the repo's Packages tab. A push to
    # main moves :latest; a v* tag adds the version tags.
    if: github.event_name == 'push'
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pulpmesh-*
          merge-multiple: true

      # The Dockerfile copies a prebuilt binary, so the context is just that
      # binary next to it rather than the source tree.
      - name: Assemble the build context
        run: |
          mkdir -p ctx
          tar -xzf "dist/pulpmesh-$TARGET.tar.gz" -C ctx
          cp .github/docker/Dockerfile ctx/

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ctx
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    # A v* tag publishes a versioned release; a push to main refreshes the
    # rolling "latest" prerelease. Pull requests stop at the artifact above.
    if: github.event_name == 'push'
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pulpmesh-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz | tee SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist/* --clobber
            else
              gh release create "$tag" dist/* --verify-tag --generate-notes
            fi
          else
            # The rolling tag has to follow main, so drop the previous release
            # and its tag before recreating them at this commit.
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest dist/* \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "latest (main)" \
              --notes "Built from ${GITHUB_SHA} by run ${GITHUB_RUN_ID}."
          fi
